<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celebrity Death Bingo – Deathwatch 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Celebrity Death Bingo: Deathwatch 2026 – Vegas neon edition. Countdown to the 2026 game with Sean, Maurice, Hugo, Róisín and Damien.">

  <!-- Google Fonts (no build tools needed) -->
  <link href="https://fonts.googleapis.com/css2?family=Monoton&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient-start: #050018;
      --bg-gradient-end: #1b0034;
      --accent-neon-pink: #ff4df3;
      --accent-neon-cyan: #25f0ff;
      --accent-neon-yellow: #ffe66b;
      --accent-neon-red: #ff3355;
      --accent-gold: #ffbf3c;
      --card-bg: rgba(5, 0, 20, 0.85);
      --text-main: #f8f7ff;
      --text-muted: #c5c1ff;
      --border-glow: rgba(255, 255, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, var(--bg-gradient-end), var(--bg-gradient-start) 55%, #000000 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle starry background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -50px;
      pointer-events: none;
      opacity: 0.45;
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255, 255, 255, 0.3) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 80% 70%, rgba(255, 255, 255, 0.3) 50%, transparent 51%),
        radial-gradient(2px 2px at 60% 40%, rgba(255, 255, 255, 0.2) 50%, transparent 51%);
      background-size: 250px 250px, 300px 300px, 280px 280px;
      mix-blend-mode: screen;
      z-index: -1;
    }

    body::after {
      opacity: 0.25;
      filter: blur(2px);
    }

    .page-wrapper {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 2rem;
      align-items: center;
      margin-bottom: 2.2rem;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    /* Neon marquee header */
    .marquee-shell {
      position: relative;
      padding: 1.25rem;
      border-radius: 2rem;
      background: radial-gradient(circle at top, #33004b, #050015 55%);
      box-shadow:
        0 0 40px rgba(255, 77, 243, 0.25),
        0 0 60px rgba(37, 240, 255, 0.15),
        0 0 0 2px rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .marquee-inner {
      border-radius: 1.5rem;
      border: 4px solid var(--accent-gold);
      padding: 1.75rem 1.5rem 1.9rem;
      background: radial-gradient(circle at top, #3b003d 0%, #0c0015 50%, #000000 100%);
      position: relative;
      text-align: center;
      box-shadow:
        0 0 0 6px rgba(0, 0, 0, 0.75),
        0 0 40px rgba(255, 191, 60, 0.55);
      overflow: hidden;
    }

    /* subtle flicker overlay */
    .marquee-inner::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.08) 0%,
        transparent 40%,
        transparent 60%,
        rgba(255, 255, 255, 0.08) 100%
      );
      mix-blend-mode: screen;
      opacity: 0;
      pointer-events: none;
    }

    .marquee-flash::after {
      animation: marqueeSweep 0.7s ease-out;
    }

    @keyframes marqueeSweep {
      0% { transform: translateX(-40%); opacity: 0.7; }
      100% { transform: translateX(40%); opacity: 0; }
    }

    .marquee-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 2px dotted rgba(255, 255, 255, 0.18);
      pointer-events: none;
    }

    .marquee-lights {
      position: absolute;
      inset: 0;
      border-radius: 2rem;
      pointer-events: none;
    }

    .marquee-lights span {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle, #fff 0%, #ffe66b 40%, #ff8a3c 65%, transparent 70%);
      box-shadow: 0 0 12px rgba(255, 230, 107, 0.9);
      animation: lightsBlink 1.4s infinite alternate;
    }

    .marquee-lights span:nth-child(1) { top: 10px; left: 14%; animation-delay: 0s; }
    .marquee-lights span:nth-child(2) { top: 10px; left: 46%; animation-delay: 0.2s; }
    .marquee-lights span:nth-child(3) { top: 10px; left: 78%; animation-delay: 0.4s; }
    .marquee-lights span:nth-child(4) { bottom: 10px; left: 24%; animation-delay: 0.6s; }
    .marquee-lights span:nth-child(5) { bottom: 10px; left: 56%; animation-delay: 0.8s; }
    .marquee-lights span:nth-child(6) { bottom: 10px; left: 88%; animation-delay: 1s; }
    .marquee-lights span:nth-child(7) { top: 24%; left: 10px; animation-delay: 0.3s; }
    .marquee-lights span:nth-child(8) { top: 62%; left: 10px; animation-delay: 0.7s; }
    .marquee-lights span:nth-child(9) { top: 24%; right: 10px; animation-delay: 0.5s; }
    .marquee-lights span:nth-child(10) { top: 62%; right: 10px; animation-delay: 0.9s; }

    @keyframes lightsBlink {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1); opacity: 1; }
    }

    .subtitle {
      font-size: 0.8rem;
